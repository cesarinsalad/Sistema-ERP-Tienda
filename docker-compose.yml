version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-erp-app
    container_name: erp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - erp-network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: erp-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - erp-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: erp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_erp}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - erp-mysql-data:/var/lib/mysql
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  erp-mysql-data:
